<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Второй этаж · Сделайте вирусно</title>
<meta name="description" content="Шесть комнат с короткими играми про работу маркетолога: можно переждать совещание или пока работает нейросеть.">
<meta name="theme-color" content="#E62020">
<link rel="icon" href="../kit/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="../kit/kit.css">
<style>
.lead{margin:2px 0 4px;font-size:15px;line-height:1.45;max-width:560px}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.door{position:relative;display:flex;flex-direction:column;gap:7px;background:var(--panel);color:var(--panel-ink);border-radius:20px;padding:16px 16px 14px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.door:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.door:focus-visible{outline:3px solid #FFD447;outline-offset:2px}
.plate{display:flex;align-items:center;gap:10px}
.plate i{font-style:normal;flex:none;background:var(--red);color:var(--white);font-weight:800;font-size:12px;border-radius:99px;padding:3px 10px 4px;font-variant-numeric:tabular-nums}
.plate span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.door b{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.door p{margin:0;font-size:14px;line-height:1.42;color:var(--panel-ink);opacity:.85;flex:1}
.door .rec{font-size:12.5px;font-weight:700;color:var(--red)}
.door .rec.none{color:var(--muted);font-weight:500}
.door.lift{background:transparent;color:var(--white);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.8)}
.door.lift p,.door.lift .plate span{color:var(--white);opacity:.9}
.door.lift .plate i{background:var(--white);color:var(--red-deep)}
.foot{font-size:12.5px;opacity:.9;margin:4px 0 0;line-height:1.45}
</style>
</head>
<body>
<div class="kit-wrap">
  <header class="kit-top" id="kitTop"></header>
  <p class="lead">Шесть комнат, где можно переждать совещание или пока нейросеть пишет код. Звука нет. Кнопка «Шеф рядом» или <kbd>Esc</kbd> прячет игру за таблицей, вернуться можно через вкладку «Лист1».</p>
  <nav class="doors" id="doors" aria-label="Комнаты"></nav>
  <p class="foot">Рекорды и начатые партии хранятся в этом браузере.</p>
</div>
<script src="../kit/kit.js"></script>
<script>
(function () {
  'use strict';
  var K = window.Kit;
  K.mount({ room: 'Второй этаж', game: 'Комнаты для перерыва', back: { href: '../', label: 'В офис' } });
  var ROOMS = [
    { n: '201', key: 'kontent-plan', room: 'Редакция', game: 'Контент-план', href: '../kontent-plan/', text: 'Раскладываете посты, сторис и рилсы по сетке недели. Заполненная неделя или день целиком уходят в публикацию.' },
    { n: '202', key: 'pravki', room: 'Переговорка «Синергия»', game: 'Правки', href: '../pravki/', text: 'Правки от генерального, юристов, продаж и его жены. Три одинаковые вносятся разом, а в лотке всего семь мест.' },
    { n: '203', key: 'kpi', room: 'Ситуационный центр', game: 'Три KPI в ряд', href: '../kpi/', text: 'Собираете показатели по три в ряд и закрываете квартал, пока Палыч не поменял KPI.' },
    { n: '204', key: 'soglasovanie', room: 'Коридор согласований', game: 'Змейка согласований', href: '../soglasovanie/', text: 'Документ ползёт по кабинетам и собирает визы. Наступили на свой хвост, и всё сначала.' },
    { n: '205', key: 'kommentarii', room: 'Модераторская', game: 'Комментарии', href: '../kommentarii/', text: 'Открываете комментарии под постом и прячете хейтеров. Цифра подсказывает, сколько их рядом.' },
    { n: '206', key: 'voronka', room: 'Отдел продаж', game: 'Воронка', href: '../voronka/', text: 'Бросаете показы в воронку. Два одинаковых шага сливаются в следующий, и так до клиента на годы.' }
  ];
  var html = '<a class="door lift" href="../"><div class="plate"><i>1</i><span>Лифт вниз</span></div><b>Офис: квест</b><p>Палыч ждёт вирусный ролик про саморезы к пятнице. Соберите бриф и согласуйте идею.</p></a>';
  ROOMS.forEach(function (r) {
    var label = K.get('label:' + r.key, null);
    html += '<a class="door" href="' + r.href + '"><div class="plate"><i>' + r.n + '</i><span>' + r.room + '</span></div>' +
      '<b>' + r.game + '</b><p>' + r.text + '</p>' +
      '<span class="rec' + (label ? '' : ' none') + '">' + (label ? 'Рекорд: ' + label : 'Ещё не играли') + '</span></a>';
  });
  document.getElementById('doors').innerHTML = html;
})();
</script>
</body>
</html>
