</style>
</head>
<body>
<div class="kit-wrap fill">

  <div class="kit-stats" id="kitStats"></div>
  <main class="kit-stage iso" id="stage"><canvas id="cv" aria-label="Двор офиса: зона отдыха с играми"></canvas><button type="button" class="act" id="act" hidden></button></main>
  <p class="kit-hint">Нажмите на место во дворе, и герой дойдёт сам. Или идите стрелками и нажмите <kbd>E</kbd> рядом с игрой. Коллег можно послушать. <kbd>Esc</kbd> прячет всё.</p>
</div>
<script src="../kit/kit.js"></script>
<script src="../kit/iso.js"></script>
<script>
(function () {
  'use strict';
  var K = window.Kit, shade = Iso.shade, hash = Iso.hash;
  var stage = document.getElementById('stage'), cv = document.getElementById('cv'), actBtn = document.getElementById('act');
  var COLS = 24, ROWS = 20;
  var READY = { 'kontent-plan': 1, pravki: 1, kpi: 1, soglasovanie: 1, kommentarii: 1, voronka: 1 };

  var W = new Iso.World({
    canvas: cv, stage: stage, cols: COLS, rows: ROWS, ext: 3, top: 215, start: [12.5, 4.4], minZoom: (window.innerWidth > 700 ? 0.5 : 0.62), maxZoom: 1.05, bg: '#5E9B49', font: K.FONT,
    look: { shirt: '#E62020', pants: '#2B2F3A', skin: '#F2C7A5', hair: '#3B2A20', style: 'short', acc: 'badge' },
    blocked: function () { return K.cardOpen() || K.bossOn(); },
    onNear: function (s) {
      if (!s) { actBtn.hidden = true; return; }
      actBtn.hidden = false;
      actBtn.innerHTML = '<kbd>E</kbd>' + (s.id === 'office' ? 'Войти в офис' : 'Играть: ' + s.game);
    },
    onSpot: useSpot
  });

  // ——— земля ———
  var GAZ = { x0: 2, y0: 5, x1: 7, y1: 9 }, VER = { x0: 15, y0: 4, x1: 21, y1: 8 }, COURT = { x0: 18, y0: 10, x1: 22, y1: 17 };
  var PATHS = [{ x0: 11, y0: 3, x1: 13, y1: 9 }, { x0: 8, y0: 7, x1: 10, y1: 7 }, { x0: 14, y0: 6, x1: 14, y1: 6 }, { x0: 15, y0: 11, x1: 17, y1: 13 },
    { x0: 15, y0: 13, x1: 16, y1: 15 }, { x0: 12, y0: 15, x1: 13, y1: 18 }, { x0: 12, y0: 18, x1: 17, y1: 18 }, { x0: 7, y0: 14, x1: 10, y1: 14 }];
  function inR(x, y, r) { return x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1; }
  function bedE(x, y) { var dx = (x + 0.5 - 5) / 3, dy = (y + 0.5 - 14.5) / 2.8; return Math.sqrt(dx * dx + dy * dy); }
  function gtype(x, y) {
    if (x >= COLS || y >= ROWS) return Math.max(x - (COLS - 1), y - (ROWS - 1)) === 1 ? 'walk' : 'road';
    if (y < 3) return 'none';
    if (inR(x, y, GAZ) || inR(x, y, VER)) return 'deck';
    if (inR(x, y, COURT)) return 'court';
    var e = bedE(x, y); if (e < 0.72) return 'soil'; if (e < 1.12) return 'path';
    if (Math.hypot(x + 0.5 - 12.5, y + 0.5 - 12.5) <= 3.3) return 'path';
    for (var i = 0; i < PATHS.length; i++) if (inR(x, y, PATHS[i])) return 'path';
    return 'grass';
  }
  W.bakeGround(function (W, c) {
    var x, y;
    for (y = 0; y < ROWS + 3; y++) for (x = 0; x < COLS + 3; x++) {
      var t = gtype(x, y), h = hash(x, y);
      if (t === 'none') continue;
      if (t === 'grass') W.dia(x, y, 1, 1, ['#7CBF5B', '#77BA56', '#82C561'][Math.floor(h * 3)]);

        W.dia(x, y, 1, 1, '#CDBFA6');
        for (var i = 0; i < 2; i++) for (var j = 0; j < 2; j++) W.dia(x + i * 0.5 + 0.035, y + j * 0.5 + 0.035, 0.43, 0.43, ['#EAE0CE', '#E3D7C2', '#EFE7D8'][Math.floor(hash(x * 2 + i, y * 2 + j, 3) * 3)]);
      } else if (t === 'deck') {
        W.dia(x, y, 1, 1, '#9E6E40');
        for (var k = 0; k < 4; k++) { var hk = hash(x, y * 4 + k, 5); W.dia(x + 0.01, y + k * 0.25 + 0.02, 0.98, 0.21, hk < 0.33 ? '#C48E58' : hk < 0.66 ? '#BD8752' : '#CB9761'); }
      } else if (t === 'court') W.dia(x, y, 1, 1, '#D9774F');
      else if (t === 'soil') W.dia(x, y, 1, 1, '#6E4A30');

      else W.dia(x, y, 1, 1, '#4B4F55');
    }
    // трава: кустики и цветочки, клумба: цветы
    for (y = 3; y < ROWS; y++) for (x = 0; x < COLS; x++) {
      var tt = gtype(x, y);
      if (tt === 'grass') {
        c.strokeStyle = 'rgba(60,120,45,.55)'; c.lineWidth = 1.2;
        for (var n = 0; n < 3; n++) {
          var p = W.iso(x + hash(x, y, n * 7 + 1), y + hash(x, y, n * 7 + 2));
          c.beginPath(); c.moveTo(p[0] - 2, p[1]); c.lineTo(p[0] - 3, p[1] - 4); c.moveTo(p[0], p[1]); c.lineTo(p[0], p[1] - 5); c.moveTo(p[0] + 2, p[1]); c.lineTo(p[0] + 3, p[1] - 4); c.stroke();
        }
        if (hash(x, y, 9) < 0.12) { var q = W.iso(x + 0.5, y + 0.5); c.fillStyle = hash(x, y, 10) < 0.5 ? '#FFFFFF' : '#FFE066'; W.dot(c, q[0], q[1], 1.8); W.dot(c, q[0] + 5, q[1] + 2, 1.5); }
      } else if (tt === 'soil') {
        for (var m = 0; m < 6; m++) {
          var f = W.iso(x + 0.1 + hash(x, y, m * 3 + 11) * 0.8, y + 0.1 + hash(x, y, m * 3 + 12) * 0.8);
          c.fillStyle = '#3F7F35'; W.dot(c, f[0], f[1], 3);
          c.fillStyle = ['#FF5D73', '#FFD23F', '#B57CFF', '#FFFFFF', '#FF8C42'][Math.floor(hash(x, y, m * 3 + 13) * 5)]; W.dot(c, f[0], f[1] - 3, 2.4);
        }
      }
    }
    // разметка площадки
    var I = W.iso.bind(W);
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2;
    W.poly([I(18.25, 10.25), I(22.75, 10.25), I(22.75, 17.75), I(18.25, 17.75)], null, 'rgba(255,255,255,.9)', 2);
    c.beginPath(); var l0 = I(18.25, 14), l1 = I(22.75, 14); c.moveTo(l0[0], l0[1]); c.lineTo(l1[0], l1[1]); c.stroke();
    W.ell(20.5, 14, 0, 0.8, null, 'rgba(255,255,255,.9)', 2);
    W.poly([I(19.6, 10.25), I(21.4, 10.25), I(21.4, 12.2), I(19.6, 12.2)], 'rgba(255,255,255,.12)', 'rgba(255,255,255,.9)', 2);
    // дорога: разметка
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2;
    for (x = 0; x < COLS + 3; x++) { var a = I(x + 0.15, ROWS + 2), b = I(x + 0.6, ROWS + 2); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); }
    for (y = 0; y < ROWS + 2; y++) { var a2 = I(COLS + 2, y + 0.15), b2 = I(COLS + 2, y + 0.6); c.beginPath(); c.moveTo(a2[0], a2[1]); c.lineTo(b2[0], b2[1]); c.stroke(); }
  });

  // ——— твёрдое ———
  for (var yy = 3; yy < ROWS; yy++) for (var xx = 0; xx < COLS; xx++) if (gtype(xx, yy) === 'soil') W.block(xx, yy);

  // ——— предметы ———
  function circ(c, p, r, col) { c.fillStyle = col; c.beginPath(); c.arc(p[0], p[1], r, 0, 7); c.fill(); }
  function tree(x, y, s, kind) {
    W.block(Math.floor(x), Math.floor(y));
    W.prop(x + y, function (c) {
      var p = W.iso(x, y, 0);
      W.shadow(x + 0.3, y + 0.3, 0.95 * s, 0.17);
      c.fillStyle = '#7A5136'; W.rr(c, p[0] - 3.5 * s, p[1] - 38 * s, 7 * s, 38 * s, 3 * s); c.fill();
      c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(p[0] + 0.5 * s, p[1] - 38 * s, 3 * s, 36 * s);
      var pal = kind === 'b' ? ['#3A7836', '#4B9442', '#5FAA52', '#83C76B'] : ['#3F8436', '#52A046', '#68B757', '#8ED170'];
      var B = [[0, -60, 22], [-16, -52, 16], [16, -50, 16], [-8, -73, 15], [9, -75, 14], [0, -45, 15]];
      B.forEach(function (b) { circ(c, [p[0] + (b[0] + 3) * s, p[1] + (b[1] + 3.5) * s], b[2] * s, pal[0]); });
      B.forEach(function (b) { circ(c, [p[0] + b[0] * s, p[1] + b[1] * s], b[2] * s, pal[1]); });
      B.forEach(function (b) { circ(c, [p[0] + (b[0] - 3.5) * s, p[1] + (b[1] - 4) * s], b[2] * s * 0.6, pal[2]); });
      [[-11, -80, 5], [-19, -57, 4], [2, -67, 6]].forEach(function (b) { circ(c, [p[0] + b[0] * s, p[1] + b[1] * s], b[2] * s, pal[3]); });
    });
  }
  function pine(x, y, s) {
    W.block(Math.floor(x), Math.floor(y));
    W.prop(x + y, function (c) {
      var p = W.iso(x, y, 0);
      W.shadow(x + 0.2, y + 0.2, 0.6 * s, 0.17);
      c.fillStyle = '#6B4A33'; c.fillRect(p[0] - 3 * s, p[1] - 18 * s, 6 * s, 18 * s);
      for (var i = 0; i < 3; i++) {
        var yb = p[1] - (14 + i * 16) * s, w = (22 - i * 5) * s, h = 30 * s;
        W.poly([[p[0] - w, yb], [p[0] + w, yb], [p[0], yb - h]], '#2F6E3A');
        W.poly([[p[0] - w, yb], [p[0], yb - h], [p[0], yb + 2 * s]], '#3E8A47');
      }
    });
  }
  function bush(x, y, s, flw) {
    W.block(Math.floor(x), Math.floor(y));
    W.prop(x + y, function (c) {
      var p = W.iso(x, y, 0);
      W.shadow(x + 0.1, y + 0.1, 0.45 * s, 0.15);
      [[-7, -9, 9], [7, -9, 9], [0, -15, 10]].forEach(function (b) { circ(c, [p[0] + (b[0] + 2) * s, p[1] + (b[1] + 2) * s], b[2] * s, '#3F8436'); });
      [[-7, -9, 9], [7, -9, 9], [0, -15, 10]].forEach(function (b) { circ(c, [p[0] + b[0] * s, p[1] + b[1] * s], b[2] * s, '#56A447'); });
      circ(c, [p[0] - 3 * s, p[1] - 19 * s], 4.5 * s, '#7BC261');
      if (flw) [[-8, -12], [5, -17], [8, -8], [-2, -21], [-11, -6]].forEach(function (f) { circ(c, [p[0] + f[0] * s, p[1] + f[1] * s], 2.2 * s, flw); });
    });
  }
  function lamp(x, y) {
    W.block(Math.floor(x), Math.floor(y));
    W.lights.push([x, y, 60, 125]);
    W.prop(x + y, function (c) {
      W.shadow(x, y, 0.18, 0.2);
      W.box(x - 0.04, y - 0.04, 0, 0.08, 0.08, 56, '#30353C');
      var h = W.iso(x, y, 60);
      c.fillStyle = '#30353C'; W.rr(c, h[0] - 6.5, h[1] - 10, 13, 4, 2); c.fill();
      circ(c, h, 5.5, W.night ? '#FFE9A6' : '#F4F0E6');
    });
  }
  function bench(x, y, axis) {
    W.prop(x + y, function () {
      var wd = '#B07A4A', mt = '#3A3F47';
      if (axis === 'x') {
        W.shadow(x, y + 0.1, 0.75, 0.14);
        W.box(x - 0.85, y - 0.12, 0, 0.07, 0.3, 11, mt); W.box(x + 0.78, y - 0.12, 0, 0.07, 0.3, 11, mt);
        W.box(x - 0.9, y - 0.22, 11, 1.8, 0.07, 22, wd); W.box(x - 0.9, y - 0.15, 11, 1.8, 0.42, 3, wd);
      } else {
        W.shadow(x + 0.1, y, 0.75, 0.14);
        W.box(x - 0.12, y - 0.85, 0, 0.3, 0.07, 11, mt); W.box(x - 0.12, y + 0.78, 0, 0.3, 0.07, 11, mt);
        W.box(x - 0.22, y - 0.9, 11, 0.07, 1.8, 22, wd); W.box(x - 0.15, y - 0.9, 11, 0.42, 1.8, 3, wd);
      }
    });
  }
  function chair(x, y, back) {
    W.prop(x + y, function () {
      var m = '#3A3F47', s = '#C9874E';
      W.box(x - 0.17, y - 0.17, 0, 0.05, 0.05, 11, m); W.box(x + 0.12, y - 0.17, 0, 0.05, 0.05, 11, m);
      W.box(x - 0.17, y + 0.12, 0, 0.05, 0.05, 11, m); W.box(x + 0.12, y + 0.12, 0, 0.05, 0.05, 11, m);
      if (back === 'n') W.box(x - 0.19, y - 0.22, 11, 0.38, 0.05, 19, s); else W.box(x - 0.22, y - 0.19, 11, 0.05, 0.38, 19, s);
      W.box(x - 0.19, y - 0.19, 11, 0.38, 0.38, 3, s);
    });
  }
  function uTable(x, y, col) {
    W.block(Math.floor(x), Math.floor(y));
    W.prop(x + y, function (c) {
      W.shadow(x, y, 0.6, 0.14);
      W.cyl(x, y, 0, 0.06, 20, '#4A4F57'); W.cyl(x, y, 20, 0.48, 3, '#EDE6DA', '#FBF8F2');
      W.cyl(x, y, 23, 0.035, 50, '#6B6F76');
      var ap = W.iso(x, y, 92), n = 12, R = 1.05, secs = [];
      for (var i = 0; i < n; i++) { var a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2, am = (a0 + a1) / 2; secs.push({ a0: a0, a1: a1, dep: Math.cos(am) + Math.sin(am), i: i, lit: Math.cos(am - 3.93) }); }
      secs.sort(function (a, b) { return a.dep - b.dep; });
      secs.forEach(function (s) {
        W.poly([ap, W.iso(x + Math.cos(s.a0) * R, y + Math.sin(s.a0) * R, 70), W.iso(x + Math.cos(s.a1) * R, y + Math.sin(s.a1) * R, 70)], shade(s.i % 2 ? '#FBF7EF' : col, s.lit * 0.12));
      });

    });
  }
  function pole(x, y, h) { W.block(Math.floor(x), Math.floor(y)); W.prop(x + y, function () { W.box(x - 0.04, y - 0.04, 0, 0.08, 0.08, h, '#5A4634'); }); }
  function garland(a, b, z) {
    W.lights.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, z - 8, 95, 'rgba(255,205,120,.32)']);
    W.prop(1e5, function (c) {
      var p0 = W.iso(a[0], a[1], z), p1 = W.iso(b[0], b[1], z), mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2 + 24;
      c.strokeStyle = 'rgba(40,40,40,.65)'; c.lineWidth = 1; c.beginPath(); c.moveTo(p0[0], p0[1]); c.quadraticCurveTo(mx, my, p1[0], p1[1]); c.stroke();

        if (W.night) circ(c, [x, y + 3], 6.5, 'rgba(255,214,120,.35)');
        circ(c, [x, y + 3], 2.5, W.night ? '#FFE7A0' : (i % 3 === 0 ? '#FFD447' : i % 3 === 1 ? '#FF8A7A' : '#FFF4D6'));
      }
    });
  }
  function hedge(x, y) {
    W.block(x, y);
    W.prop(x + y + 0.5, function (c) {
      W.box(x + 0.04, y + 0.04, 0, 0.92, 0.92, 14, '#4A9440', { top: '#5DAA4F', left: '#4A9440', right: '#3D7F36' });
      var p = W.iso(x + 0.5, y + 0.5, 14); circ(c, [p[0] - 8, p[1] - 1], 6, '#62B052'); circ(c, [p[0] + 7, p[1] + 1], 5, '#62B052');
    });
  }

  // здание офиса
  W.block(0, 0, COLS - 1, 2);
  W.lights.push([12.5, 3.3, 46, 150]);
  W.prop(-1000, function (c) {
    var H = 168, brick = '#B4543C';
    W.box(0, 0, 0, COLS, 3, H, brick, { top: '#8C857E', left: brick, right: shade(brick, -0.22) });
    W.face('x', 0, COLS, 3.001, 0, 10, '#8E4030');
    [56, 112].forEach(function (z) { W.face('x', 0, COLS, 3.002, z, z + 5, '#E4D6C4'); W.face('y', 0, 3, COLS + 0.002, z, z + 5, '#CDBFAE'); });
    W.face('x', 0, COLS, 3.002, H - 10, H, '#EDE3D5'); W.face('y', 0, 3, COLS + 0.002, H - 10, H, '#D6CBBC');
    for (var f = 0; f < 3; f++) {
      var z0 = 18 + f * 56;
      for (var i = 0; i < 12; i++) {
        var a = 0.45 + i * 2; if (f === 0 && a > 9.5 && a < 14.5) continue;
        W.face('x', a - 0.08, a + 1.18, 3.003, z0 - 3, z0 + 33, '#F1E9DC');
        W.face('x', a, a + 1.1, 3.004, z0, z0 + 30, W.night ? (hash(i, f, 2) < 0.7 ? '#FFD98A' : '#3A4A5E') : '#46647F');
        if (!W.night) W.poly([W.iso(a + 0.12, 3.005, z0 + 30), W.iso(a + 0.5, 3.005, z0 + 30), W.iso(a + 0.12, 3.005, z0 + 10)], 'rgba(255,255,255,.2)');
        W.face('x', a + 0.53, a + 0.57, 3.005, z0, z0 + 30, '#F1E9DC');
      }
      [0.45, 1.65].forEach(function (j, k) {
        W.face('y', j - 0.06, j + 0.96, COLS + 0.003, z0 - 3, z0 + 33, '#D9CFC1');
        W.face('y', j, j + 0.9, COLS + 0.004, z0, z0 + 30, W.night ? (hash(k, f, 4) < 0.6 ? '#F2C878' : '#323F50') : '#3B566E');
      });
    }
    W.face('x', 11.3, 13.7, 3.004, 0, 46, '#2B2F36');
    W.face('x', 11.42, 12.46, 3.006, 2, 43, W.night ? '#FFE2A0' : '#88AECB');
    W.face('x', 12.54, 13.58, 3.006, 2, 43, W.night ? '#FFE2A0' : '#88AECB');
    W.box(11.0, 3.0, 48, 3.0, 0.75, 6, '#E62020');
    W.box(11.1, 3.0, 0, 2.8, 0.5, 4, '#D3CABD');
    W.face('x', 10.2, 14.8, 3.006, 62, 92, '#E62020');
    var p = W.iso(12.5, 3.007, 77);
    c.save(); c.transform(1, 0.5, 0, 1, p[0], p[1]); c.strokeStyle = '#FFFFFF'; c.lineWidth = 2.2; c.beginPath(); c.ellipse(0, 0, 66, 11.5, 0, 0, 7); c.stroke(); c.restore();
    W.faceText('сделайте вирусно', 12.5, 3.007, 77, 'x', '800 15px ' + K.FONT, '#FFFFFF', 'center');
  });

    var lab = K.get('label:' + s.id, null);

      btns: [['Играть', function () { location.href = s.href; }], ['Не сейчас']] });
  }
  actBtn.addEventListener('click', function () { useSpot(W.near); });

  // ——— шапка, время суток ———
  K.mount({ room: 'Двор офиса', game: 'Зона отдыха', back: { href: '../', label: 'В офис' }, stats: [['clock', 'Время', '—'], ['done', 'Рекорды', '—']] });
  function clock() { var d = new Date(); K.stat('clock', d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0')); }
  var hr = new Date().getHours();
  W.night = K.get('dvor:night', null) != null ? K.get('dvor:night', false) : (hr >= 19 || hr < 7);
  var nightBtn = K.action(W.night ? 'Сделать день' : 'Сделать вечер', function () {
    W.night = !W.night; K.set('dvor:night', W.night); nightBtn.textContent = W.night ? 'Сделать день' : 'Сделать вечер';
  });
  K.onPause = function () { W.keys = {}; };
  clock(); setInterval(clock, 30000);
  refreshBadges();
  W.resize();
  if (window.ResizeObserver) new ResizeObserver(function () { W.resize(); }).observe(stage); else window.addEventListener('resize', function () { W.resize(); });
  W.bind(); W.start();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { W.t += 0; });
  setTimeout(function () { W.talk(W.npcs[0]); }, 1200);
  window.__w = W;
})();
</script>
</body>
</html>
