<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Двор офиса · Сделайте вирусно</title>
<style>body{margin:0;background:#E62020;color:#fff;font:16px/1.4 system-ui,sans-serif;display:grid;place-items:center;height:100vh}a{color:#fff}</style>
<script>
(function () {
  var side = 'client';
  try { var v = localStorage.getItem('sv:kv:lastSide'); if (v) side = JSON.parse(v); } catch (e) {}
  if (side !== 'client' && side !== 'agency') side = 'client';
  location.replace('../ofis/?side=' + side);
})();
</script>
</head>
<body><p>Двор теперь слева от офиса: <a href="../ofis/?side=client">«Бурёнка в кедах»</a> или <a href="../ofis/?side=agency">«Финал Финал 2»</a></p></body>
</html>
